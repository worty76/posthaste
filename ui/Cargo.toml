[package]
name = "posthaste-ui"
description = "Posthaste's interface, written in Rust and compiled to WebAssembly."
version.workspace = true
edition.workspace = true
license.workspace = true
workspace = "../src-tauri"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
posthaste-model = { path = "../src-tauri/crates/model" }
posthaste-i18n = { path = "../src-tauri/crates/i18n" }

# Everything that needs a browser is built for WebAssembly only. `logic/`
# stays plain Rust, so `cargo test -p posthaste-ui` runs on any machine.
[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Must match the wasm-bindgen CLI that scripts/build-ui.sh runs.
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "DomTokenList", "DomStringMap",
  "CssStyleDeclaration", "HtmlTextAreaElement", "HtmlInputElement",
  "KeyboardEvent", "MediaQueryList", "Event", "EventTarget", "Navigator",
  "MouseEvent", "Node", "ScrollIntoViewOptions", "ScrollLogicalPosition",
  "HtmlDialogElement", "HtmlButtonElement", "HtmlSelectElement", "HtmlCollection",
  "HtmlDocument", "Clipboard", "ClipboardEvent", "DataTransfer", "FileList", "File", "Blob",
  "FocusEvent", "VisibilityState",
] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
futures = { version = "0.3", default-features = false, features = ["std"] }
gloo-timers = "0.3"
send_wrapper = "0.6"
console_error_panic_hook = "0.1"
