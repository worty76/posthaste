[workspace]
members = [".", "crates/core", "crates/platform"]
resolver = "2"

[workspace.package]
version = "0.3.2"
edition = "2021"
license = "MIT"

[package]
name = "posthaste"
description = "Capture a thought from anywhere, without leaving what you're doing."
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "posthaste"

[lib]
name = "posthaste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
posthaste-core = { path = "crates/core" }
posthaste-platform = { path = "crates/platform" }
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
thiserror = "2"
# AI provider keys live in the OS credential store, never in the settings.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
log = "0.4"

# The floating windows are non-activating panels on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
