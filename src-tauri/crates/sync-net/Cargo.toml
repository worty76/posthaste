[package]
name = "posthaste-sync-net"
description = "Peer-to-peer QUIC transport and pairing codes for Posthaste device sync (iroh)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
iroh = "1"
posthaste-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
