name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main] # main is covered by the release workflow

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown # the Rust interface in ui/
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev build-essential
      - name: Install wasm-bindgen
        # Must equal the wasm-bindgen version pinned in ui/Cargo.toml.
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked
      - name: Install frontend dependencies
        run: npm install
      - name: Formatting and rule checks
        run: npm run check
      - name: Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace
      # npm run test:ui is not here yet: it needs playwright-core as a
      # dev dependency and a Chrome binary on the runner.
