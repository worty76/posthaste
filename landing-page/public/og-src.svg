<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Share image, Ink look (colours from src/lib/looks.ts and derive.ts).
       Render: rsvg-convert og-src.svg -o og.png, with static Recursive
       instances installed as RecMonoHead (wght 800, slnt -9, MONO 1) and
       RecMono (wght 600, MONO 1). -->
  <rect width="1200" height="630" fill="#0f0f0f"/>
  <text x="72" y="92" font-family="RecMono" font-size="28" fill="#f2f2f2">Posthaste</text>
  <text font-family="RecMonoHead" font-size="74" fill="#f2f2f2" letter-spacing="-2">
    <tspan x="66" y="208">Get it out of your</tspan>
    <tspan x="66" y="292">head in two seconds.</tspan>
  </text>
  <rect x="72" y="360" width="1056" height="190" rx="6" fill="#181818" stroke="#f2f2f2" stroke-opacity="0.14"/>
  <rect x="104" y="392" width="4" height="20" rx="2" fill="#ffffff"/>
  <text x="120" y="408" font-family="RecMono" font-size="22" fill="#f2f2f2">Posthaste <tspan fill="#9c9c9c">from your browser</tspan></text>
  <text x="104" y="478" font-family="RecMono" font-size="36" fill="#f2f2f2">Call the dentist before Friday</text>
  <rect x="760" y="448" width="3" height="40" fill="#ffffff"/>
  <text x="1096" y="526" text-anchor="end" font-family="RecMono" font-size="20" fill="#9c9c9c">Enter save   esc clear</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
