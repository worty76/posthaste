<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Share image, Strawberry Milk look (colours from src/lib/looks.ts and
       derive.ts). Render: rsvg-convert og-src.svg -o og.png, with static
       Recursive instances installed as RecHead, RecBody and RecMono. -->
  <rect width="1200" height="630" fill="#fff5f7"/>
  <text x="72" y="92" font-family="RecBody" font-size="30" fill="#4a2c3a">Posthaste</text>
  <text font-family="RecHead" font-size="84" fill="#4a2c3a" letter-spacing="-2">
    <tspan x="66" y="212">Get it out of your</tspan>
    <tspan x="66" y="300">head in two seconds.</tspan>
  </text>
  <rect x="72" y="360" width="1056" height="190" rx="22" fill="#ffffff" stroke="#4a2c3a" stroke-opacity="0.18"/>
  <rect x="104" y="392" width="4" height="20" rx="2" fill="#ff8fb1"/>
  <text x="120" y="408" font-family="RecBody" font-size="22" fill="#4a2c3a">Posthaste <tspan fill="#806873">from your browser</tspan></text>
  <text x="104" y="478" font-family="RecBody" font-size="40" fill="#4a2c3a">Call the dentist before Friday</text>
  <rect x="706" y="446" width="3" height="42" fill="#96566c"/>
  <text x="1096" y="526" text-anchor="end" font-family="RecMono" font-size="20" fill="#806873">Enter save   esc clear</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
