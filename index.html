<!doctype html>
<!-- The one page every window loads. The interface is Rust compiled to
     WebAssembly (ui/); ui/boot.js starts it. The first frame wears Ink,
     the factory default, before anything has loaded. -->
<html lang="en" data-theme="dark" data-font="mono" data-shape="sharp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Posthaste</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/ui/boot.js"></script>
  </body>
</html>
